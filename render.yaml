services:
  - type: web
    name: the-royal-passage-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8080,https://the-royal-passage.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreplay@theroyalpassage.com
      - key: SITE_URL
        value: https://the-royal-passage.vercel.app

  - type: cron
    name: host-booking-reminders
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app.services.host_booking_reminders import process_host_booking_reminders; import json; print(json.dumps(process_host_booking_reminders()))"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreplay@theroyalpassage.com
      - key: SITE_URL
        value: https://the-royal-passage.vercel.app
