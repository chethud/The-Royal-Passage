services:
  - type: web
    name: the-royal-passage-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8080,https://the-royal-passage.vercel.app
