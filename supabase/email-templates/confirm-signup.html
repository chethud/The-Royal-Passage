<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Confirm your account — The Royal Passage</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    @media only screen and (max-width: 620px) {
      .shell { width: 100% !important; }
      .page-pad { padding: 18px 8px !important; }
      .card-pad { padding: 28px 20px 24px !important; }
      .logo-lg { height: 96px !important; max-height: 96px !important; }
      .title-lg { font-size: 21px !important; }
      .tagline-sm { font-size: 8px !important; letter-spacing: 0.28em !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; -webkit-text-size-adjust: 100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="page-pad" style="background: #ffffff; padding: 48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="shell" style="width: 600px; max-width: 600px; border: 1px solid rgba(200, 162, 90, 0.22); border-radius: 12px; padding: 1px; background: linear-gradient(145deg, rgba(200,162,90,0.35), rgba(92,26,36,0.2), rgba(200,162,90,0.25));">
          <tr>
            <td style="background-color: #261218; border-radius: 11px; overflow: hidden;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="height: 4px; background: linear-gradient(90deg, #5c1a24, #c8a25a, #d4af6a, #c8a25a, #5c1a24); font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
                <tr>
                  <td class="card-pad" style="padding: 44px 44px 36px; text-align: center;">
                    <a href="https://the-royal-passage.vercel.app" style="text-decoration: none;">
                      <img src="https://the-royal-passage.vercel.app/brand/logo.svg" alt="The Royal Passage" height="150" class="logo-lg" style="display: block; margin: 0 auto 12px; max-height: 150px; width: auto; border: 0; opacity: 0.96;" />
                    </a>
                    <p class="tagline-sm" style="margin: 0 0 24px; font-family: Cinzel, Georgia, serif; font-size: 9px; letter-spacing: 0.42em; text-transform: uppercase; color: #c8a25a;">Mysuru &middot; Curated Royal Journeys</p>
                    <h1 class="title-lg" style="margin: 0 0 20px; font-family: 'Cinzel Decorative', Cinzel, Georgia, serif; font-size: 24px; font-weight: 400; color: #f7f1e8; letter-spacing: 0.06em;">Confirm Your Account</h1>
                    <p style="margin: 0 0 16px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 17px; line-height: 1.75; color: #c4b5a5;">Welcome to <strong style="color: #d4af6a;">The Royal Passage</strong>. Please confirm your email to finish creating your account.</p>
                    <p style="margin: 28px 0;">
                      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: linear-gradient(135deg, #c8a25a 0%, #d4af6a 50%, #c8a25a 100%); color: #2d0000; font-family: Cinzel, Georgia, serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; padding: 17px 42px; border-radius: 6px;">Confirm Email</a>
                    </p>
                    <p style="margin: 0 0 28px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; font-style: italic; color: #9a8a78;">If you did not sign up, you can ignore this email.</p>
                    <p style="margin: 0 0 6px; font-family: Cinzel, Georgia, serif; font-size: 11px; letter-spacing: 0.24em; color: #c8a25a;">THE ROYAL PASSAGE</p>
                    <p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; font-style: italic; color: #9a8a78;">Curated Heritage Experiences Across Mysuru</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
