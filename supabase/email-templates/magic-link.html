<!DOCTYPE html>
<html lang="en">
<body style="font-family: Georgia, 'Times New Roman', Times, serif; color: #3d2314; background-color: #ebe3d4; margin: 0; padding: 28px 14px;">
  <div style="max-width: 580px; margin: 0 auto; background: #fffdf8; border: 1px solid #d9c9ad; border-radius: 6px; overflow: hidden;">
    <div style="height: 5px; background: linear-gradient(90deg, #4a0a14 0%, #b8860b 50%, #4a0a14 100%);"></div>
    <div style="padding: 28px 30px 26px;">
      <div style="text-align: center; margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid #e0d4c0;">
        <img src="https://the-royal-passage.vercel.app/brand/logo.png" alt="The Royal Passage" height="140" style="display: block; margin: 0 auto 10px; max-height: 140px; width: auto; border: 0;" />
        <p style="margin: 0; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #9a7b4f;">Mysuru &middot; Curated royal journeys</p>
      </div>
      <h1 style="margin: 0 0 18px; font-size: 23px; font-weight: normal; color: #5c1a24; text-align: center;">Your sign-in link</h1>
      <p style="line-height: 1.65; font-size: 15px;">Tap the button below to sign in to <strong>The Royal Passage</strong>. This link expires soon and can only be used once.</p>
      <p style="text-align: center; margin: 28px 0;">
        <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #5c1a24; color: #fffdf8; text-decoration: none; padding: 14px 28px; border-radius: 4px; font-size: 14px; letter-spacing: 0.06em;">Sign in securely</a>
      </p>
      <p style="line-height: 1.6; font-size: 13px; color: #6b5b4d;">If you did not request this email, you can ignore it.</p>
      <div style="margin-top: 28px; padding-top: 18px; border-top: 1px solid #e8dcc8; text-align: center;">
        <p style="margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a1f2b;">The Royal Passage</p>
      </div>
    </div>
  </div>
</body>
</html>
