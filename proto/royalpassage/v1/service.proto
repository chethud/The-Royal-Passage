syntax = "proto3";

package royalpassage.v1;

import "google/protobuf/empty.proto";
import "royalpassage/v1/types.proto";

service RoyalPassageService {
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListCities(google.protobuf.Empty) returns (ListCitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetCity(GetCityRequest) returns (CitySummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetCatalog(GetCatalogRequest) returns (CatalogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetExperienceBySlug(GetExperienceBySlugRequest) returns (ExperienceDetailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListHomestays(ListHomestaysRequest) returns (ListHomestaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetHomestayBySlug(GetHomestayBySlugRequest) returns (HomestayDetailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateHomestayBooking(CreateHomestayBookingRequest) returns (CreateHomestayBookingResponse);

  rpc ListGuestHomestayBookings(ListGuestHomestayBookingsRequest) returns (ListHomestayBookingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetGuestHomestayBooking(GetGuestHomestayBookingRequest) returns (HomestayBookingSummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CancelGuestHomestayBooking(CancelGuestHomestayBookingRequest) returns (HomestayBookingSummary);

  rpc GetOwnerDashboard(google.protobuf.Empty) returns (OwnerDashboardStats) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListOwnerHomestays(google.protobuf.Empty) returns (ListOwnerHomestaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateOwnerHomestay(CreateOwnerHomestayRequest) returns (OwnerHomestayDetail);

  rpc GetOwnerHomestay(GetOwnerHomestayRequest) returns (OwnerHomestayDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc UpdateOwnerHomestay(UpdateOwnerHomestayInput) returns (OwnerHomestayDetail);

  rpc DeleteOwnerHomestay(DeleteOwnerHomestayRequest) returns (OkResponse);

  rpc CreateOwnerHomestayRoom(CreateOwnerHomestayRoomInput) returns (OwnerHomestayDetail);

  rpc UpdateOwnerHomestayRoom(UpdateOwnerHomestayRoomInput) returns (OwnerHomestayDetail);

  rpc DeleteOwnerHomestayRoom(DeleteOwnerHomestayRoomRequest) returns (OwnerHomestayDetail);

  rpc UpsertOwnerAvailability(UpsertOwnerAvailabilityInput) returns (OwnerHomestayDetail);

  rpc DeleteOwnerAvailability(DeleteOwnerAvailabilityRequest) returns (OwnerHomestayDetail);

  rpc ListOwnerHomestayBookings(ListOwnerHomestayBookingsRequest) returns (ListHomestayBookingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetOwnerHomestayBooking(GetOwnerHomestayBookingRequest) returns (HomestayBookingSummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ConfirmOwnerHomestayBooking(OwnerHomestayBookingActionRequest) returns (HomestayBookingSummary);

  rpc RejectOwnerHomestayBooking(OwnerHomestayBookingActionRequest) returns (HomestayBookingSummary);

  rpc MarkOwnerHomestayBookingPaid(OwnerHomestayBookingActionRequest) returns (HomestayBookingSummary);

  rpc CompleteOwnerHomestayBooking(OwnerHomestayBookingActionRequest) returns (HomestayBookingSummary);

  rpc ListOwnerVipPackages(google.protobuf.Empty) returns (ListOwnerVipPackagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateOwnerVipPackage(CreateOwnerVipPackageRequest) returns (OwnerVipPackageDetail);

  rpc GetOwnerVipPackage(GetOwnerVipPackageRequest) returns (OwnerVipPackageDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc UpdateOwnerVipPackage(UpdateOwnerVipPackageInput) returns (OwnerVipPackageDetail);

  rpc SkipVipMembershipInterest(google.protobuf.Empty) returns (GuestProfile);

  rpc SubmitVipMembershipApplication(SubmitVipMembershipApplicationRequest) returns (GuestProfile);

  rpc SubmitVipCustomPackageRequest(CreateVipCustomPackageRequest) returns (VipCustomPackageRequestSummary);

  rpc ListVipMembershipApplications(google.protobuf.Empty) returns (ListVipMembershipApplicationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ApproveVipMembership(VipMembershipActionRequest) returns (VipMembershipApplicationSummary);

  rpc RejectVipMembership(VipMembershipActionRequest) returns (VipMembershipApplicationSummary);

  rpc ListVipCustomPackageRequests(google.protobuf.Empty) returns (ListVipCustomPackageRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);

  rpc ListMyBookings(ListMyBookingsRequest) returns (ListBookingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetBooking(GetBookingRequest) returns (BookingSummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CancelBooking(CancelBookingRequest) returns (BookingSummary);

  rpc GetGuestProfile(google.protobuf.Empty) returns (GuestProfile) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc UpdateGuestProfile(UpdateGuestProfileRequest) returns (GuestProfile);

  rpc ListWishlist(google.protobuf.Empty) returns (ListWishlistResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc AddToWishlist(AddToWishlistRequest) returns (WishlistItem);

  rpc RemoveFromWishlist(RemoveFromWishlistRequest) returns (OkResponse);

  rpc GetHostDashboard(google.protobuf.Empty) returns (HostDashboardStats) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListHostBookings(ListHostBookingsRequest) returns (ListBookingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetHostBooking(GetHostBookingRequest) returns (BookingSummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetHostRevenue(google.protobuf.Empty) returns (HostRevenueSummary) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListHostReviews(google.protobuf.Empty) returns (ListHostReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListHostCategories(google.protobuf.Empty) returns (ListHostCategoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListHostExperiences(google.protobuf.Empty) returns (ListHostExperiencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateHostExperience(CreateHostExperienceRequest) returns (HostExperienceDetail);

  rpc GetHostExperience(GetHostExperienceRequest) returns (HostExperienceDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc UpdateHostExperience(UpdateHostExperienceInput) returns (HostExperienceDetail);

  rpc DeleteHostExperience(DeleteHostExperienceRequest) returns (OkResponse);

  rpc CreateHostSlot(CreateHostSlotInput) returns (HostExperienceDetail);

  rpc UpdateHostSlot(UpdateHostSlotInput) returns (HostExperienceDetail);

  rpc DeleteHostSlot(DeleteHostSlotRequest) returns (HostExperienceDetail);

  rpc ConfirmHostBooking(HostBookingActionRequest) returns (BookingSummary);

  rpc RejectHostBooking(HostBookingActionRequest) returns (BookingSummary);

  rpc MarkHostBookingPaid(HostBookingActionRequest) returns (BookingSummary);

  rpc CompleteHostBooking(HostBookingActionRequest) returns (BookingSummary);

  rpc PauseHostBooking(HostBookingActionRequest) returns (BookingSummary);

  rpc ResumeHostBooking(HostBookingActionRequest) returns (BookingSummary);

  rpc GetAdminStats(google.protobuf.Empty) returns (AdminStats) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListAdminBookings(google.protobuf.Empty) returns (ListAdminBookingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListAdminActivity(google.protobuf.Empty) returns (ListAdminActivityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListAdminUsers(google.protobuf.Empty) returns (ListAdminUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateHost(CreateHostRequest) returns (CreateHostResponse);

  rpc CreatePlatformUser(CreatePlatformUserRequest) returns (CreatePlatformUserResponse);

  rpc CreateHomestayOwner(CreateHomestayOwnerRequest) returns (CreateHomestayOwnerResponse);

  rpc CreateVipOwner(CreateVipOwnerRequest) returns (CreateVipOwnerResponse);

  rpc ListAdminExperiences(google.protobuf.Empty) returns (ListAdminExperiencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetAdminExperience(AdminExperienceActionRequest) returns (AdminExperienceDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc PublishExperience(AdminExperienceActionRequest) returns (AdminExperienceSummary);

  rpc RejectExperience(AdminExperienceActionRequest) returns (AdminExperienceSummary);

  rpc ListAdminHomestays(google.protobuf.Empty) returns (ListAdminHomestaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetAdminHomestay(AdminHomestayActionRequest) returns (AdminHomestayDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc PublishHomestay(AdminHomestayActionRequest) returns (AdminHomestaySummary);

  rpc RejectHomestay(AdminHomestayActionRequest) returns (AdminHomestaySummary);

  rpc ListAdminVipPackages(google.protobuf.Empty) returns (ListAdminVipPackagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetAdminVipPackage(AdminVipPackageActionRequest) returns (AdminVipPackageDetail) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc PublishVipPackage(AdminVipPackageActionRequest) returns (AdminVipPackageSummary);

  rpc RejectVipPackage(AdminVipPackageActionRequest) returns (AdminVipPackageSummary);

  rpc ListExperienceReviews(ListExperienceReviewsRequest) returns (ListExperienceReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateReview(CreateReviewRequest) returns (ReviewSummary);

  rpc HostReplyToReview(HostReplyToReviewRequest) returns (ReviewSummary);

  rpc ListAdminReviews(google.protobuf.Empty) returns (ListAdminReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc HideAdminReview(HideAdminReviewRequest) returns (ReviewSummary);

  rpc ListNotifications(google.protobuf.Empty) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (NotificationSummary);

  rpc MarkAllNotificationsRead(google.protobuf.Empty) returns (MarkAllNotificationsReadResponse);
}

message GetCityRequest {
  string slug = 1;
}

message GetCatalogRequest {
  optional string city_slug = 1;
}

message GetExperienceBySlugRequest {
  string slug = 1;
}

message ListHomestaysRequest {
  optional string city_slug = 1;
}

message GetHomestayBySlugRequest {
  string slug = 1;
}

message ListMyBookingsRequest {
  optional string status = 1;
}

message GetBookingRequest {
  string booking_id = 1;
}

message CancelBookingRequest {
  string booking_id = 1;
}

message AddToWishlistRequest {
  string experience_id = 1;
}

message RemoveFromWishlistRequest {
  string experience_id = 1;
}

message ListHostBookingsRequest {
  optional string status = 1;
}

message GetHostBookingRequest {
  string booking_id = 1;
}

message GetHostExperienceRequest {
  string experience_id = 1;
}

message DeleteHostExperienceRequest {
  string experience_id = 1;
}

message CreateHostSlotInput {
  string experience_id = 1;
  CreateHostSlotRequest slot = 2;
}

message UpdateHostSlotInput {
  string experience_id = 1;
  string slot_id = 2;
  UpdateHostSlotRequest slot = 3;
}

message DeleteHostSlotRequest {
  string experience_id = 1;
  string slot_id = 2;
}

message HostBookingActionRequest {
  string booking_id = 1;
}

message AdminExperienceActionRequest {
  string experience_id = 1;
}

message ListExperienceReviewsRequest {
  string slug = 1;
}

message HostReplyToReviewRequest {
  string review_id = 1;
  HostReplyRequest reply = 2;
}

message HideAdminReviewRequest {
  string review_id = 1;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
}

message UpdateHostExperienceInput {
  string experience_id = 1;
  UpdateHostExperienceRequest experience = 2;
}

message ListGuestHomestayBookingsRequest {
  optional string status = 1;
}

message GetGuestHomestayBookingRequest {
  string booking_id = 1;
}

message CancelGuestHomestayBookingRequest {
  string booking_id = 1;
}

message GetOwnerHomestayRequest {
  string homestay_id = 1;
}

message DeleteOwnerHomestayRequest {
  string homestay_id = 1;
}

message UpdateOwnerHomestayInput {
  string homestay_id = 1;
  UpdateOwnerHomestayRequest homestay = 2;
}

message CreateOwnerHomestayRoomInput {
  string homestay_id = 1;
  CreateOwnerHomestayRoomRequest room = 2;
}

message UpdateOwnerHomestayRoomInput {
  string homestay_id = 1;
  string room_id = 2;
  UpdateOwnerHomestayRoomRequest room = 3;
}

message DeleteOwnerHomestayRoomRequest {
  string homestay_id = 1;
  string room_id = 2;
}

message UpsertOwnerAvailabilityInput {
  string homestay_id = 1;
  UpsertOwnerAvailabilityRequest availability = 2;
}

message DeleteOwnerAvailabilityRequest {
  string homestay_id = 1;
  string availability_id = 2;
}

message ListOwnerHomestayBookingsRequest {
  optional string status = 1;
}

message GetOwnerHomestayBookingRequest {
  string booking_id = 1;
}

message OwnerHomestayBookingActionRequest {
  string booking_id = 1;
}

message AdminHomestayActionRequest {
  string homestay_id = 1;
}

message AdminVipPackageActionRequest {
  string package_id = 1;
}

message GetOwnerVipPackageRequest {
  string package_id = 1;
}

message UpdateOwnerVipPackageInput {
  string package_id = 1;
  UpdateOwnerVipPackageRequest package = 2;
}
