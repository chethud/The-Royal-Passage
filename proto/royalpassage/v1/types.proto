syntax = "proto3";

package royalpassage.v1;

import "google/protobuf/struct.proto";

message Slot {
  string id = 1;
  string date = 2;
  string start = 3;
  string end = 4;
  int32 capacity = 5;
  int32 available = 6;
}

message CitySummary {
  string slug = 1;
  string name = 2;
  optional string region = 3;
  string state = 4;
  optional string tagline = 5;
  optional string description = 6;
}

message Experience {
  string id = 1;
  string slug = 2;
  string title = 3;
  string tagline = 4;
  string description = 5;
  string category = 6;
  string city = 7;
  optional string city_slug = 8;
  string address = 9;
  double duration_hours = 10;
  string host_name = 11;
  string host_bio = 12;
  bool verified_host = 13;
  int32 price_per_person = 14;
  double rating = 15;
  int32 reviews_count = 16;
  string image = 17;
  repeated string inclusions = 18;
  string cancellation = 19;
  repeated Slot slots = 20;
  optional string currency_symbol = 21;
  int32 min_guests_per_booking = 22;
  int32 max_guests_per_booking = 23;
  repeated string gallery_urls = 24;
  repeated string exclusions = 25;
  repeated string requirements = 26;
  optional string region = 27;
}

message CatalogResponse {
  string mode = 1;
  repeated Experience experiences = 2;
  repeated string categories = 3;
  repeated string cities = 4;
  repeated string city_slugs = 5;
}

message ExperienceDetailResponse {
  Experience exp = 1;
  string source = 2;
}

message CreateBookingRequest {
  string slot_id = 1;
  int32 guest_count = 2;
  optional string notes = 3;
}

message CreateBookingResponse {
  string booking_id = 1;
  int32 total_amount = 2;
  string currency_code = 3;
  string booking_status = 4;
  string payment_status = 5;
  string payment_method = 6;
}

message BookingSlotSummary {
  string id = 1;
  string date = 2;
  string start = 3;
  string end = 4;
}

message BookingExperienceSummary {
  string id = 1;
  string slug = 2;
  string title = 3;
  string city = 4;
  string address = 5;
  string image = 6;
  string host_name = 7;
}

message BookingSummary {
  string id = 1;
  BookingExperienceSummary experience = 2;
  BookingSlotSummary slot = 3;
  int32 participant_count = 4;
  int32 total_amount = 5;
  string currency_code = 6;
  string currency_symbol = 7;
  string booking_status = 8;
  string payment_status = 9;
  string payment_method = 10;
  optional string notes = 11;
  string created_at = 12;
  optional string confirmed_at = 13;
  optional string guest_name = 14;
  optional string guest_email = 15;
  optional string guest_phone = 16;
}

message HostDashboardStats {
  int32 pending_bookings = 1;
  int32 confirmed_bookings = 2;
  int32 completed_bookings = 3;
  int32 revenue_collected_minor = 4;
  int32 revenue_pending_minor = 5;
  int32 week_revenue_estimate_minor = 6;
  int32 upcoming_bookings = 7;
  int32 today_bookings = 8;
  int32 published_experiences = 9;
  string currency_symbol = 10;
  int32 total_bookings = 11;
}

message HostRevenueDay {
  string date = 1;
  int32 collected_minor = 2;
  int32 pending_minor = 3;
  int32 estimated_minor = 4;
}

message HostRevenueSummary {
  int32 collected_minor = 1;
  int32 pending_minor = 2;
  int32 estimated_minor = 3;
  repeated HostRevenueDay week = 4;
  string currency_symbol = 5;
}

message HostReviewSummary {
  string id = 1;
  string experience_id = 2;
  string experience_title = 3;
  int32 rating = 4;
  optional string comment = 5;
  optional string reviewer_display_name = 6;
  optional string host_reply = 7;
  optional string host_replied_at = 8;
  bool is_verified = 9;
  string created_at = 10;
}

message ManagedUser {
  string id = 1;
  optional string email = 2;
  optional string full_name = 3;
  optional string phone = 4;
  string role = 5;
  optional string host_id = 6;
  string created_at = 7;
}

message CreateHostRequest {
  string display_name = 1;
  string email = 2;
  string password = 3;
  optional string phone = 4;
  optional string bio = 5;
}

message CreateHostResponse {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string host_id = 4;
}

message GuestProfile {
  string id = 1;
  optional string email = 2;
  optional string full_name = 3;
  optional string phone = 4;
  string role = 5;
  string created_at = 6;
}

message UpdateGuestProfileRequest {
  optional string full_name = 1;
  optional string phone = 2;
}

message WishlistExperienceSummary {
  string id = 1;
  string slug = 2;
  string title = 3;
  optional string tagline = 4;
  string city = 5;
  string image = 6;
  int32 price_per_person = 7;
  double rating = 8;
  int32 reviews_count = 9;
  string currency_symbol = 10;
  string host_name = 11;
}

message WishlistItem {
  string experience_id = 1;
  string saved_at = 2;
  WishlistExperienceSummary experience = 3;
}

message CategoryOption {
  string slug = 1;
  string label = 2;
}

message HostSlotDetail {
  string id = 1;
  string date = 2;
  string start = 3;
  string end = 4;
  int32 capacity = 5;
  int32 seats_sold = 6;
  int32 available = 7;
  bool is_blocked = 8;
}

message HostExperienceSummary {
  string id = 1;
  string slug = 2;
  string title = 3;
  string city = 4;
  string status = 5;
  int32 price_per_person_minor = 6;
  string currency_symbol = 7;
  int32 slot_count = 8;
  optional string image = 9;
}

message HostExperienceDetail {
  string id = 1;
  string slug = 2;
  string title = 3;
  optional string tagline = 4;
  optional string description = 5;
  string category_slug = 6;
  string category_label = 7;
  string city = 8;
  optional string city_slug = 9;
  optional string region = 10;
  optional string address = 11;
  int32 duration_minutes = 12;
  int32 price_per_person_minor = 13;
  string status = 14;
  optional string hero_image_url = 15;
  repeated string inclusions = 16;
  repeated string exclusions = 17;
  repeated string requirements = 18;
  optional string cancellation_policy = 19;
  int32 min_guests_per_booking = 20;
  int32 max_guests_per_booking = 21;
  string currency_code = 22;
  string currency_symbol = 23;
  repeated HostSlotDetail slots = 24;
  string created_at = 25;
  string updated_at = 26;
  repeated string gallery_urls = 27;
}

message CreateHostExperienceRequest {
  string title = 1;
  optional string slug = 2;
  optional string tagline = 3;
  string description = 4;
  string category_slug = 5;
  string city_slug = 6;
  optional string city = 7;
  optional string region = 8;
  optional string address = 9;
  int32 duration_minutes = 10;
  int32 price_per_person_minor = 11;
  optional string hero_image_url = 12;
  repeated string inclusions = 13;
  repeated string exclusions = 14;
  repeated string requirements = 15;
  optional string cancellation_policy = 16;
  int32 min_guests_per_booking = 17;
  int32 max_guests_per_booking = 18;
  bool submit_for_review = 19;
  repeated string gallery_urls = 20;
}

message UpdateHostExperienceRequest {
  optional string title = 1;
  optional string slug = 2;
  optional string tagline = 3;
  optional string description = 4;
  optional string category_slug = 5;
  optional string city_slug = 6;
  optional string city = 7;
  optional string region = 8;
  optional string address = 9;
  optional int32 duration_minutes = 10;
  optional int32 price_per_person_minor = 11;
  optional string hero_image_url = 12;
  repeated string inclusions = 13;
  repeated string exclusions = 14;
  repeated string requirements = 15;
  optional string cancellation_policy = 16;
  optional int32 min_guests_per_booking = 17;
  optional int32 max_guests_per_booking = 18;
  bool submit_for_review = 19;
  repeated string gallery_urls = 20;
}

message CreateHostSlotRequest {
  string slot_date = 1;
  string start_time = 2;
  string end_time = 3;
  int32 capacity = 4;
}

message UpdateHostSlotRequest {
  optional string slot_date = 1;
  optional string start_time = 2;
  optional string end_time = 3;
  optional int32 capacity = 4;
  optional bool is_blocked = 5;
}

message AdminExperienceSummary {
  string id = 1;
  string slug = 2;
  string title = 3;
  string city = 4;
  string status = 5;
  string host_name = 6;
  string created_at = 7;
}

message AdminExperienceDetail {
  string id = 1;
  string slug = 2;
  string title = 3;
  optional string tagline = 4;
  optional string description = 5;
  string category_slug = 6;
  string category_label = 7;
  string city = 8;
  optional string city_slug = 9;
  optional string region = 10;
  optional string address = 11;
  int32 duration_minutes = 12;
  int32 price_per_person_minor = 13;
  string status = 14;
  optional string hero_image_url = 15;
  repeated string inclusions = 16;
  repeated string exclusions = 17;
  repeated string requirements = 18;
  optional string cancellation_policy = 19;
  int32 min_guests_per_booking = 20;
  int32 max_guests_per_booking = 21;
  string currency_code = 22;
  string currency_symbol = 23;
  repeated HostSlotDetail slots = 24;
  string created_at = 25;
  string updated_at = 26;
  repeated string gallery_urls = 27;
  string host_name = 28;
  optional string host_email = 29;
  optional string host_phone = 30;
  optional string host_bio = 31;
  bool host_verified = 32;
}

message ReviewSummary {
  string id = 1;
  string experience_id = 2;
  optional string booking_id = 3;
  int32 rating = 4;
  optional string comment = 5;
  optional string reviewer_display_name = 6;
  optional string host_reply = 7;
  optional string host_replied_at = 8;
  bool is_verified = 9;
  string status = 10;
  string created_at = 11;
}

message CreateReviewRequest {
  string booking_id = 1;
  int32 rating = 2;
  optional string comment = 3;
}

message HostReplyRequest {
  string reply = 1;
}

message NotificationSummary {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  google.protobuf.Struct metadata = 5;
  optional string read_at = 6;
  string created_at = 7;
}

message AuditLogEntry {
  string id = 1;
  string action = 2;
  string entity_type = 3;
  optional string entity_id = 4;
  optional string actor_name = 5;
  google.protobuf.Struct metadata = 6;
  string created_at = 7;
}

message AdminStats {
  int32 total_guests = 1;
  int32 total_hosts = 2;
  int32 published_experiences = 3;
  int32 total_bookings = 4;
  int32 revenue_collected_minor = 5;
  int32 pending_experience_reviews = 6;
  string currency_symbol = 7;
  int32 confirmed_bookings = 8;
  int32 pending_bookings = 9;
  int32 completed_bookings = 10;
  int32 cancelled_bookings = 11;
  int32 gross_booking_value_minor = 12;
  int32 platform_revenue_minor = 13;
  int32 host_payout_due_minor = 14;
  int32 cod_pending_collection_minor = 15;
  double commission_percent = 16;
}

message AdminBookingRow {
  string id = 1;
  optional string guest_name = 2;
  optional string guest_email = 3;
  string experience_title = 4;
  string booking_status = 5;
  string payment_status = 6;
  int32 total_amount = 7;
  string currency_symbol = 8;
  string created_at = 9;
  int32 platform_fee_minor = 10;
  int32 host_payout_minor = 11;
  optional string host_name = 12;
}

message OkResponse {
  bool ok = 1;
}

message MarkAllNotificationsReadResponse {
  bool ok = 1;
  int32 count = 2;
}

message HealthResponse {
  string status = 1;
}

message ListCitiesResponse {
  repeated CitySummary cities = 1;
}

message ListBookingsResponse {
  repeated BookingSummary bookings = 1;
}

message ListHostReviewsResponse {
  repeated HostReviewSummary reviews = 1;
}

message ListHostCategoriesResponse {
  repeated CategoryOption categories = 1;
}

message ListHostExperiencesResponse {
  repeated HostExperienceSummary experiences = 1;
}

message ListAdminUsersResponse {
  repeated ManagedUser users = 1;
}

message ListAdminExperiencesResponse {
  repeated AdminExperienceSummary experiences = 1;
}

message ListExperienceReviewsResponse {
  repeated ReviewSummary reviews = 1;
}

message ListAdminReviewsResponse {
  repeated ReviewSummary reviews = 1;
}

message ListNotificationsResponse {
  repeated NotificationSummary notifications = 1;
}

message ListAdminActivityResponse {
  repeated AuditLogEntry entries = 1;
}

message ListAdminBookingsResponse {
  repeated AdminBookingRow bookings = 1;
}

message ListWishlistResponse {
  repeated WishlistItem items = 1;
}
